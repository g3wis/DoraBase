[package]
name = "dorabase"
version = "0.9.0"
description = "Explorateur de bases de données desktop"
authors = ["DoraBase"]
edition = "2021"
rust-version = "1.77.2"
# Sans cette clé, `cargo run` est ambigu depuis l'ajout du binaire `export-types` (plan
# `06a`) et `tauri dev` échoue — il appelle `cargo run` sans `--bin`. Le défaut a échappé
# à la CI, qui lance `tauri build` mais jamais `tauri dev`.
default-run = "dorabase"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "dorabase_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

# Les tests exigeant une vraie base sont derrière cette feature, et non `#[ignore]` :
# une feature les rend *absents* du job macOS au lieu de silencieux. Le compte d'ignorés
# reste ainsi réservé au Trousseau de `05c`, plutôt que de devenir une poubelle où deux
# familles de tests se cachent. Lancés par le job Linux de la CI.
[features]
db-tests = []

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
ts-rs = "12.0.1"
chacha20poly1305 = { version = "0.11.0", features = ["getrandom", "rand_core"] }
keyring = "4.1.6"
tokio-postgres = "0.7.18"
# **Le vérificateur SCRAM-SHA-256 d'un mot de passe de rôle** (`API-32`, 9 septembre 2026).
#
# Les cinq crates sont **déjà dans l'arbre**, tirées par `postgres-protocol` qui s'en sert pour
# l'authentification SCRAM du pilote ; les versions sont donc épinglées sur les siennes, pour ne pas
# faire cohabiter deux `sha2` ou deux `hmac` dans le binaire. Voir `engine/postgres/scram.rs` pour ce
# que ce hachage côté client achète, et pourquoi il n'est pas facultatif ici.
hmac = "0.13"
sha2 = "0.11"
base64 = "0.22"
rand = "0.10"
# La normalisation SASLprep du mot de passe (RFC 4013), qu'un serveur PostgreSQL applique avant de
# hacher : sans elle, un mot de passe non-ASCII produirait un vérificateur que le pilote ne
# retrouverait pas à la connexion suivante — un compte verrouillé, sans message.
stringprep = "0.1"
# **Le TLS de `06f`, en `rustls`.** Le choix est tranché dans la spec : le pilote MongoDB n'offre pas
# `native-tls`, et ni lui ni `mysql_async` n'acceptent un `ClientConfig` arbitraire — donc le trousseau
# du système n'est atteignable nulle part uniformément, et l'argument qui militait pour `native-tls`
# tombe. `rustls` donne en échange **un seul comportement** sur macOS et en CI Linux.
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
# Le pilote officiel MongoDB (`18b`), asynchrone sur le `tokio` que `06a` impose déjà.
#
# `default-features = false` écarte deux choses de la valeur par défaut :
#   - `compat-3-0-0`, qui ramène `bson` 2 en plus de 3 — deux versions du même type de document ;
#   - `dns-resolver`, qui ne sert qu'aux URI `mongodb+srv://`. La déclaration de `05a` porte un
#     hôte et un port, jamais un enregistrement SRV : la résolution serait du code mort. À
#     rebrancher si une base Atlas est un jour déclarée par son URI.
mongodb = { version = "3", default-features = false, features = ["bson-3", "rustls-tls", "compat-3-3-0"] }
# `bson` est déjà là — le pilote le réexporte en `mongodb::bson`. La dépendance directe n'ajoute pas
# une seconde copie : elle **active la feature `serde`**, sans laquelle le module `extjson` n'existe
# pas, donc sans laquelle un document imbriqué ne peut pas devenir du JSON (`18a`).
bson = { version = "3", features = ["serde", "serde_json-1"] }
# Les curseurs du pilote sont des `Stream` : sans `StreamExt`, il n'y a pas de `next()`. Le pilote
# en dépend déjà — cette ligne ne fait qu'en rendre le trait visible ici.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# SQLite (`17a`). `bundled` embarque la bibliothèque C : sans elle, l'application dépendrait du
# `libsqlite3` du système — dont la version varie d'un macOS à l'autre, et qui n'est pas garanti
# compilé avec les mêmes options. Un explorateur de bases ne peut pas dépendre de ce hasard.
rusqlite = { version = "0.37", features = ["bundled"] }
# MySQL / MariaDB (`16a`). Pilote **pur Rust** sur `tokio`, comme les deux autres : aucune
# dépendance système, ce que la crate officielle d'Oracle imposerait.
#
# `default-features = false` puis `minimal-rust` : la valeur par défaut tire `flate2` avec un moteur
# de compression C, et la compression d'un protocole vers `localhost` ou un tunnel SSH ne sert à rien.
# **`tls12` est explicite, et c'est un piège de feature** : `rustls-tls` seul ne propose que TLS 1.3,
# et beaucoup de serveurs MySQL d'entreprise sont en 1.2 — l'échec ressemblerait à un problème de
# certificat. Voir `06f`.
mysql_async = { version = "0.36", default-features = false, features = [
  "minimal-rust",
  "rustls-tls",
  "tls12",
  "ring",
] }
# `process` pour le sous-processus du proxy Cloud SQL (`06g`), `time` pour borner l'attente de son
# démarrage — sans délai, un proxy muet pendrait indéfiniment.
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "time"] }
russh = "0.62.5"
tauri-plugin-dialog = "2"
# La mise à jour en place (`maj/`). Enregistré pour son **API Rust** : aucune de ses commandes
# IPC n'est ouverte à la webview, et `tests/permissions.rs` le garde.
#
# **Le piège vérifié plutôt que supposé** : le plugin amène `reqwest`, donc un second usage de
# `rustls` — et deux fournisseurs cryptographiques compilés dans le même binaire font *paniquer*
# `ClientConfig::builder()` à l'exécution, là où `06f` l'appelle sans fournisseur explicite. La
# panne serait apparue à la première connexion TLS, pas à la compilation. `cargo tree -e features`
# dit que ce n'est pas le cas : `reqwest` prend `rustls-no-provider`, la seule feature de fournisseur
# activée sur `rustls` reste `ring`, et l'`aws-lc-rs` du graphe vient de `russh` — il y était déjà.
# Le jour où une dépendance activerait `aws_lc_rs` sur `rustls`, c'est ici qu'il faudra passer le
# plugin en `native-tls`.
tauri-plugin-updater = "2"
# BigQuery (`21`). Ses fonctionnalités par défaut (`rust-tls`, `ring`, `gzip`) choisissent déjà le
# même fournisseur `rustls`/`ring` que le reste du projet — vérifié par `cargo tree -e features` :
# la totalité de l'arbre de cette crate (y compris `yup-oauth2`, `hyper-rustls`, `tonic`) résout sur
# un seul `rustls` 0.23 en `ring`, sans `aws-lc-rs` ni `native-tls`. Le piège de `06j`/`06k` — deux
# fournisseurs cryptographiques dans le même binaire — ne s'applique donc pas ici.
gcp-bigquery-client = "0.24"
# BigQuery rend ses horodatages `TIMESTAMP` en secondes Unix, pas en texte ISO 8601 comme les autres
# moteurs. `chrono` est déjà résolu dans l'arbre (via `rusqlite`/`mongodb`) : cette ligne ne fait
# qu'en rendre l'API visible ici, pour la seule conversion dont ce moteur a besoin.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# `MockRuntime`, seul moyen du projet de construire un menu natif pour de vrai et
# d'inspecter le résultat (`Menu::items()`, `Submenu::items()`) — voir `menu/build.rs`.
tauri = { version = "2.11.3", features = ["test"] }

# `harness = false` : `tests/menu_build.rs` construit un vrai menu muda, qui sur macOS
# exige le thread principal du **processus** — le harness `libtest` par défaut exécute
# chaque `#[test]` sur un thread de travail qu'il spawn lui-même, jamais ce thread-là. Voir
# la doc de tête de `src/menu/build.rs`.
[[test]]
name = "menu_build"
harness = false
