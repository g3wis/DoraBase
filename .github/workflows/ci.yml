name: CI
# **Ce que coûte une exécution est la première contrainte de ce fichier** (#189, 17 octobre 2026).
# Une minute macOS se facture dix minutes Linux, une minute Windows deux. Mesuré avant : une PR
# payait ~232 minutes pondérées à **chaque** push, puis la fusion rejouait exactement la même chose
# sur `main`. Quatre décisions, dans l'ordre de ce qu'elles économisent :
#
# 1. **Plus rien ne tourne à la fusion.** La PR a vérifié le commit de fusion que GitHub compose
#    avec la base ; le rejouer sur `main` donnait un second verdict identique, au prix du premier.
#    Ce qui reste vrai et qu'il faut savoir : si `main` avance entre la dernière exécution d'une PR
#    et sa fusion, l'arbre fusionné n'est vérifié que par la publication, qui rejoue les
#    vérifications rapides avant de créer la release (voir `publication.yml`, job `verifier`).
# 2. **Chaque job ne tourne que si ce qui a changé le concerne** — le job `perimetre`, et la règle
#    dans `scripts/perimetre-ci.py`. Une PR qui ne change qu'`AGENTS.md` ne lance plus rien.
# 3. **Ce qui ne dépend pas du système tourne sous Linux.** Vitest, `tsc`, Biome, les jetons, les
#    projections, `cargo fmt`, et `cargo test` — que le job Linux rejouait déjà en entier, décors
#    compris. macOS ne garde que ce qui exige macOS : les captures de fidélité de Playwright
#    (`-darwin.png`) et le `.dmg`.
# 4. **Un push par-dessus une exécution en cours l'annule** (`concurrency`). Une PR à quatre
#    pushes en une demi-heure payait quatre CI entières.
#
# Les mises en place communes — Node, pnpm, Rust, son cache, le sidecar, la pile GTK — vivent dans
# `.github/actions/preparer`, que `publication.yml` emploie aussi : ce qui ne tourne que sur un tag
# est ainsi exercé à chaque PR.
on:
  pull_request:
  # **À la main, sur n'importe quelle branche** — c'est ainsi qu'on obtient le `.dmg` ou le `.exe`
  # d'une branche dont la PR ne touche pas la chaîne de paquet.
  workflow_dispatch:
    inputs:
      portee:
        description: "tout, ou seulement les bundles téléchargeables"
        type: choice
        default: paquets
        options:
          - paquets
          - tout
  # **La chauffe hebdomadaire du cache Rust.** Un cache n'est visible que de la référence qui l'a
  # écrit et de la branche par défaut : depuis que rien ne tourne plus sur `main` à la fusion, sans
  # cette exécution chaque PR recompilerait Rust à froid — plus cher qu'une exécution par semaine.
  # Elle revérifie `main` au passage, sur les runners bon marché seulement (Linux et Windows), et
  # elle garde le cache vivant : GitHub évince ce que personne n'a lu depuis sept jours.
  schedule:
    - cron: "17 5 * * 1"

# Une exécution par PR : le push suivant annule la précédente. Hors PR, le groupe est l'exécution
# elle-même, donc rien ne s'annule.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # **Ce qui doit tourner**, lu dans le diff de la PR. Dix secondes de Linux pour décider de
  # dizaines de minutes de macOS. La règle et ses raisons sont dans le script.
  perimetre:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.calcul.outputs.web }}
      rust: ${{ steps.calcul.outputs.rust }}
      windows: ${{ steps.calcul.outputs.windows }}
      e2e: ${{ steps.calcul.outputs.e2e }}
      paquet: ${{ steps.calcul.outputs.paquet }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Le commit de fusion **et ses parents** : `HEAD^1..HEAD` est ce que la PR apporte.
          fetch-depth: 2
      - id: calcul
        run: python3 scripts/perimetre-ci.py
        env:
          EVENEMENT: ${{ github.event_name }}
          PORTEE: ${{ inputs.portee }}

  # **Tout ce qui ne dépend pas du système**, sous Linux. Ces étapes tournaient sur macOS, au
  # décuple, pour un verdict qui ne dépend pas de la machine — Vitest seul y prenait 2 min 14.
  web:
    needs: perimetre
    if: needs.perimetre.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparer

      # Un marqueur de sabotage laissé par un contrôle négatif ne casse rien — c'est justement le
      # problème. Voir l'en-tête du script.
      - run: ./scripts/verifier-aucun-sabotage.sh

      # Que ce fichier-ci et `publication.yml` décrivent ce qu'on croit, et que la règle du
      # périmètre réponde ce qu'on attend d'elle. Jusqu'au 17 octobre 2026, ce garde ne tournait
      # que dans `verifier-tout.sh` : rien ne l'imposait à une PR qui oubliait de le lancer.
      - run: python3 scripts/verifier-ci.py

      # Les trois fichiers qui portent le numéro de version doivent dire la même chose. Rien dans
      # l'outillage ne les relie : `package.json` (que `tauri.conf.json` lit), `Cargo.toml` et
      # `Cargo.lock`. Relevés à la main dans deux sur trois, ils laissent la CI verte et publient un
      # `.dmg` dont le nom contredit son `Info.plist`.
      - run: python3 scripts/verifier-version.py

      # **Le recouvrement de configuration Windows ne doit rien perdre.** Tauri fusionne
      # `tauri.windows.conf.json` par RFC 7386, où un tableau est **remplacé** : une clef absente
      # du recouvrement retombe sur le défaut de Tauri (800 × 600, sans titre) sans que rien
      # échoue. C'est du Python sur deux fichiers JSON — il n'a rien à faire sur un runner Windows.
      - run: python3 scripts/verifier-conf-windows.py

      - run: pnpm typecheck
      - run: pnpm lint

      # Garde-fou : `tokens.css` et `tokens.ts` sont générés depuis `tokens.json`, jamais édités à
      # la main. Régénérer puis exiger un diff vide échoue si quelqu'un y a touché — ou si la source
      # a bougé sans que la sortie soit reconstruite.
      - run: pnpm tokens:check

      - run: pnpm test

      # **Le front livré, construit comme `tauri build` le construit** (`beforeBuildCommand`), et le
      # garde sur la version de décor : elle est figée sous Playwright, sans quoi chaque publication
      # périmerait les captures de fidélité, et elle ne doit pas sortir du décor. Ce garde vivait
      # après le bundle macOS ; il ne regarde que `dist/`, que Linux produit à l'identique.
      - run: pnpm build
      - run: ./scripts/verifier-aucun-decor-de-version.sh

  # **Le Rust sous Linux, décors compris** — l'ancien job `engine`, qui fait désormais tout le Rust
  # que le système ne décide pas.
  #
  # Pourquoi Linux : les *service containers* et Docker n'existent que là, et une minute y coûte le
  # dixième d'une minute macOS. Ce que macOS a de propre côté Rust tient en trois lignes de
  # `menu/mod.rs`, que `tauri build` compile dans `paquet-macos` et dans la publication, et que
  # `verifier-tout.sh` compile sur chaque poste de développement — tous sous macOS.
  #
  # Les tests sur base réelle sont derrière la feature `db-tests` et non `#[ignore]` : sans la
  # feature ils n'existent pas.
  rust:
    needs: perimetre
    if: needs.perimetre.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # **Une borne de temps, parce qu'une stalle ne doit pas se déguiser en travail.** Le 19 août
    # 2026, `apt-get update` est resté pendu près d'une heure sur le miroir Ubuntu du runner : le
    # job apparaissait « en cours », et rien ne distinguait cette panne d'une compilation lente.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparer
        with:
          rust: "true"
          pile-linux: "true"
          # Partagée avec le job `verifier` de `publication.yml`, qui compile la même crate pour
          # la même cible : la chauffe hebdomadaire sert aux deux.
          cache-rust: linux

      # **Le client PostgreSQL 17, et pas celui du runner.** L'export et l'import délèguent à
      # `pg_dump` et `psql` : sans eux, ces tests ne mesurent rien. Et la version compte — le
      # runner ships `pg_dump` 16, le décor est un `postgres:17`, et un outil plus ancien que le
      # serveur refuse de le dumper. C'est le verdict `ToolTooOld`, juste mais stérile ici : il
      # ferait échouer toute la famille pour une raison qui n'est pas le code.
      #
      # Le dépôt PGDG est donc ajouté, et la **majeure est épinglée** sur celle de l'image de
      # `pg-test.sh`. Les deux doivent bouger ensemble ; l'étape suivante le constate plutôt que
      # d'attendre l'échec de dix tests.
      - name: le client PostgreSQL 17, pour les tests de dump
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          bash scripts/apt-reessaye.sh postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # Que le client trouvé soit bien le 17, et non celui de l'image du runner : `apt` peut avoir
      # installé sans que le `PATH` change d'avis, et l'ordre décide.
      - name: le pg_dump du PATH est bien celui du décor
        run: |
          set -euo pipefail
          pg_dump --version
          psql --version
          pg_dump --version | grep -qE ' 17\.' || {
            echo "::error::pg_dump n'est pas en 17 — le décor est un postgres:17"
            exit 1
          }

      # Une fois, ici : la mise en forme ne dépend pas du système, et elle tournait sur macOS
      # **et** sur Windows.
      - run: cargo fmt --all --check
        working-directory: src-tauri

      # Avec `db-tests`, comme `verifier-tout.sh` quand les décors sont là : sans la feature, le
      # code des tests sur base réelle n'existe pas pour clippy, et ses avertissements passent.
      - run: cargo clippy --all-targets --features db-tests -- -D warnings
        working-directory: src-tauri

      # `cargo run` sans `--bin` doit rester non ambigu : c'est ce que `tauri dev` appelle, et
      # l'ajout du binaire `export-types` l'a cassé sans que la CI le voie — `tauri build` ne passe
      # pas par ce chemin. Vérifié par `cargo metadata` plutôt qu'en lançant `cargo run` : l'app ne
      # traite aucun argument, donc elle ouvrirait une fenêtre et bloquerait le runner.
      - name: cargo run reste non ambigu (default-run)
        working-directory: src-tauri
        run: cargo metadata --format-version 1 --no-deps | python3 ../scripts/verifier-default-run.py

      # `src/domain/*.ts`, projeté depuis les types Rust par ts-rs. Régénérer puis exiger un diff
      # vide échoue si quelqu'un y a touché, ou si un type Rust a bougé sans que la projection suive.
      - run: pnpm domain:check

      # Les quatre décors, montés par les **mêmes scripts** qu'en local : une variante CI qu'on ne
      # peut pas essayer localement finit par diverger de ce qu'on croit qu'elle fait.
      #
      # PostgreSQL **avec TLS** (`06f`) : le décor a besoin d'un certificat dont le nom commun ne
      # correspond pas à l'hôte joint, ce qui demande `-c ssl_cert_file=…` — pas exprimable dans les
      # options d'un service container.
      - name: monter le décor PostgreSQL
        run: ./scripts/pg-test.sh demarrer
        env:
          DORABASE_TEST_PG_PORT: 5432

      # `--replSet rs0` n'est pas exprimable dans un service container non plus, or un `mongod`
      # isolé ne sait pas ouvrir de transaction : `18f` n'y testerait que son refus.
      - name: monter le décor MongoDB
        run: ./scripts/mongo-test.sh demarrer
        env:
          DORABASE_TEST_MONGO_PORT: 27017

      # Le script porte l'attente d'initialisation et le `--default-character-set=utf8mb4` sans
      # lequel le décor entre en latin1 (défaut n° 59).
      - name: monter le décor MySQL
        run: ./scripts/mysql-test.sh demarrer
        env:
          DORABASE_TEST_MYSQL_PORT: 3306

      - name: monter le bastion SSH
        run: ./scripts/bastion-test.sh demarrer "$RUNNER_TEMP/bastion"

      # **Une seule exécution de la suite, et le contrôle des tests SSH lit son journal.** Les tests
      # SSH se **sautent** quand le décor manque, ce qui les rendrait invisibles si le bastion
      # échouait à démarrer sans casser le job. Ce contrôle relançait `cargo test … tunnel` une
      # seconde fois pour lire leur sortie — 43 secondes pour une question que la première
      # exécution peut déjà trancher : `--show-output` rend la sortie des tests réussis, où un test
      # sauté écrit « décor SSH absent ».
      - name: tests, avec base et bastion — et aucun test SSH sauté
        working-directory: src-tauri
        run: |
          set -euo pipefail
          set -a
          . "$RUNNER_TEMP/bastion/bastion.env"
          set +a
          cargo test --features db-tests -- --show-output 2>&1 | tee "$RUNNER_TEMP/tests.log"
          if grep -q "décor SSH absent" "$RUNNER_TEMP/tests.log"; then
            grep "décor SSH absent" "$RUNNER_TEMP/tests.log"
            echo "::error::des tests SSH ont été sautés alors que le bastion est censé tourner"
            exit 1
          fi
          echo "$(grep -c '^test engine::tunnel::tests_ssh' "$RUNNER_TEMP/tests.log") tests SSH exécutés"
        env:
          DORABASE_TEST_PG: postgres://dorabase:dorabase-test@localhost:5432/dorabase_test
          DORABASE_TEST_PG_CERTS: /tmp/dorabase-test-pg-certs
          DORABASE_TEST_MONGO: mongodb://localhost:27017
          DORABASE_TEST_MYSQL: mysql://dorabase:dorabase-test@localhost:3306/dorabase_test
          DORABASE_TEST_MYSQL_CA: /tmp/dorabase-test-mysql-ca.pem

  # **Le Rust sous Windows**, depuis le 31 août 2026.
  #
  # Il existe pour une raison précise : `src/dump/discover.rs` employait `std::os::unix` sans
  # garde, et **le job Linux ne pouvait pas le voir** — `std::os::unix` existe là aussi. Le seul
  # moyen d'attraper cette famille de défauts est de compiler et de tester pour Windows.
  #
  # **Rien d'autre ici.** Ni Node — il n'a rien à construire —, ni `cargo fmt`, que le job `rust`
  # passe une fois pour tous, ni les gardes en Python, qui lisent des fichiers et non le système.
  # L'installateur NSIS est construit par `paquet-windows`, quand la chaîne de paquet change.
  windows:
    needs: perimetre
    if: needs.perimetre.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparer
        with:
          node: "false"
          rust: "true"
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      # `clippy --all-targets` **compile** les tests mais ne les exécute pas : un test qui échouait
      # passait donc la CI en silence, jusqu'au 5 août 2026 — un `assert_eq!(1, 2)` laissait
      # clippy vert.
      - run: cargo test
        working-directory: src-tauri

  # **Playwright, seul sur macOS, quand le front change.**
  #
  # **Le job reste sur macOS**, et ce n'est pas un reste d'histoire : les captures de fidélité
  # portent le suffixe de plateforme (`a1-accueil-darwin.png`). Sur Linux, Playwright chercherait
  # des références `-linux` qui n'existent pas, et les *écrirait* — une suite verte qui ne compare
  # rien.
  #
  # **Un seul job, et non plus deux tranches.** Le découpage (`--shard`) rendait le verdict plus
  # tôt, mais chaque tranche payait sa propre mise en place et sa propre minute entamée, au
  # décuple. Le temps de mur est ici le prix accepté de la facture.
  e2e:
    needs: perimetre
    if: needs.perimetre.outputs.e2e == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparer

      # `--with-deps` n'installe des paquets système que sur Linux ; ici il ne ferait rien.
      - run: pnpm exec playwright install chromium

      - run: pnpm test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          # `test-results/` porte les captures réelle/attendue/diff produites par l'échec — c'est ce
          # qu'on récupère pour committer la référence générée en CI. `playwright-report/` est le
          # rapport HTML de navigation, utile en plus.
          path: |
            playwright-report/
            test-results/

  # **Le `.dmg` de la branche, quand la chaîne de paquet change ou qu'on le demande.**
  #
  # Ce job construisait à **chaque** push un bundle release — 3 min 18 de `tauri build` au décuple,
  # plus la compilation release qui va avec —, pour une chaîne que 4 commits sur 57 touchaient
  # (septembre-octobre 2026). Il tourne désormais quand une PR touche ce que seule cette chaîne
  # lit — configuration du bundler, habillage du `.dmg`, icônes, sidecar, dépendances — et à la
  # main, par « Run workflow » sur la branche.
  #
  # **La question « est-ce que ça se lance ? » ne se tranche qu'en lançant**, et Playwright ne
  # pilote pas WKWebView : l'artefact sert à essayer une branche sans la compiler soi-même. Ce
  # n'est **pas** une publication : mono-architecture, gardé sept jours, réservé aux comptes qui
  # ont accès au dépôt. Les versions publiées sortent de `publication.yml`, en bundle universel.
  paquet-macos:
    needs: perimetre
    if: needs.perimetre.outputs.paquet == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparer
        with:
          rust: "true"

      # Le fond de la fenêtre du `.dmg` est un bitmap committé : aucune compilation ne le relit,
      # aucune ne comparerait ses cotes à celles que `tauri.conf.json` déclare. `sips` et
      # `tiffutil` n'existent que sur macOS — c'est la raison de sa place ici.
      - run: ./scripts/verifier-fond-dmg.sh

      - uses: ./.github/actions/cle-jetable

      # `TAURI_BUNDLER_DMG_IGNORE_CI` : **sans elle, le `.dmg` sort avec la vue Finder par défaut.**
      # Le bundler DMG de Tauri ajoute `--skip-jenkins` dès qu'il voit `CI` dans l'environnement, et
      # ce drapeau saute l'AppleScript qui pose le fond, la taille de fenêtre et la position des
      # deux icônes. Rien n'échoue, rien ne l'annonce — d'où l'étape « la fenêtre d'installation
      # est dans le .dmg » plus bas, qui le constate.
      - run: pnpm tauri build
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: true

      # Que le binaire du proxy soit *embarqué* se prouve ici ; qu'il soit *trouvé* par l'app
      # lancée depuis le Finder demande un œil humain. Sans cette étape, un `externalBin` retiré de
      # `tauri.conf.json` laisserait la CI verte et casserait Cloud SQL chez l'utilisateur.
      - name: le proxy Cloud SQL est bien dans le bundle
        run: |
          set -euo pipefail
          app=src-tauri/target/release/bundle/macos/DoraBase.app
          test -x "$app/Contents/MacOS/cloud-sql-proxy"
          test -f "$app/Contents/Resources/licences/cloud-sql-proxy/LICENSE"
          test -f "$app/Contents/Resources/licences/cloud-sql-proxy/VERSION"
          # Le binaire embarqué doit porter la version du verrou, et non celle qu'un cache aurait
          # laissée : c'est tout l'objet du verrou.
          attendue=$(sed -n 's/^version *= *//p' src-tauri/cloud-sql-proxy.lock | head -1)
          "$app/Contents/MacOS/cloud-sql-proxy" --version | grep -F "$attendue"

      # L'habillage de la fenêtre du volume traverse une configuration déclarative, un script
      # shell, un AppleScript et le Finder. Aucun de ces maillons ne rend d'erreur quand le fond
      # n'arrive pas — le `.dmg` a l'air normal. Le script monte l'image et regarde.
      - name: la fenêtre d'installation est dans le .dmg
        run: ./scripts/verifier-dmg-monte.sh "$(ls src-tauri/target/release/bundle/dmg/*.dmg)"

      # Le `.dmg` seul, et non le `.app` : `upload-artifact` réempaquette dans un zip qui ne garde
      # ni les bits d'exécution ni les liens symboliques du bundle — un `.app` ainsi transporté ne
      # se lance pas. Le `.dmg` est une image opaque, il traverse intact.
      - uses: actions/upload-artifact@v4
        with:
          name: DoraBase-${{ github.sha }}-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 7
          # Un artefact vide serait un piège : on le télécharge, il ne contient rien, et on cherche
          # la cause du côté du bundle.
          if-no-files-found: error

  # **L'installateur Windows de la branche**, dans les mêmes conditions que le `.dmg`. Il n'est pas
  # signé (pas de certificat Authenticode) : SmartScreen avertira au téléchargement.
  paquet-windows:
    needs: perimetre
    if: needs.perimetre.outputs.paquet == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparer
        with:
          rust: "true"
      - uses: ./.github/actions/cle-jetable
      - run: pnpm tauri build

      # Le proxy embarqué, vérifié dans le bundle plutôt que supposé. NSIS empaquette dans un
      # installateur, donc c'est l'arborescence de `release/` qu'on regarde : c'est elle que le
      # bundler copie.
      - name: le proxy Cloud SQL porte bien son extension
        shell: bash
        run: |
          set -euo pipefail
          test -f src-tauri/target/release/cloud-sql-proxy.exe
          attendue=$(sed -n 's/^version *= *//p' src-tauri/cloud-sql-proxy.lock | head -1)
          src-tauri/target/release/cloud-sql-proxy.exe --version | grep -F "$attendue"

      - uses: actions/upload-artifact@v4
        with:
          name: DoraBase-${{ github.sha }}-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error
