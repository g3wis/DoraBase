name: Publication

# Un tag `vX.Y.Z` poussé sur `main` construit le bundle macOS et l'attache à une release
# GitHub, d'où il est téléchargeable. Rien d'autre ne déclenche ce workflow : une publication
# est un geste, pas un effet de bord d'un push.
#
# Le geste complet, côté humain, est dans `scripts/version.sh` et dans le README.
on:
  push:
    tags:
      # Motif **ancré** sur les trois nombres : `v0.1.0-essai` ou `v1.2` ne publient pas. Le
      # format de version est fermé (voir `scripts/verifier-version.py`) ; un tag qui sort du
      # format produirait un nom de bundle que rien n'a décidé.
      - "v[0-9]+.[0-9]+.[0-9]+"

# La seule permission dont le job a besoin, et il en a besoin : créer la release et y attacher
# le `.dmg`. Le reste du jeton reste en lecture.
permissions:
  contents: write

jobs:
  # ── La release, créée une fois, pour que macOS et Windows publient en parallèle ──────────
  #
  # **Avant le 2 septembre 2026**, c'était le job `macos` qui appelait `gh release create` en
  # toute fin de construction, et `windows` déclarait `needs: macos` pour ne pas courir contre
  # une release qui n'existait pas encore. Cela tenait, mais ça sérialisait deux constructions
  # indépendantes : Windows attendait que les quarante minutes de la cible universelle macOS
  # soient passées avant de commencer les siennes.
  #
  # Ce job-ci ne compile rien : il ne fait que ce qui ne dépend d'aucun bundle — vérifier le
  # tag, écrire les notes, créer la release **sans aucun asset**. `gh release create` sans
  # fichier joint est une release valide, à laquelle `macos` et `windows` **ajoutent** leurs
  # artefacts par `gh release upload`, jamais par un second `create` — c'est toujours la même
  # raison qu'avant : deux appels à `create` divergeraient sur le titre, les notes ou
  # `--latest`. Les deux jobs de construction déclarent `needs: release` l'un et l'autre, mais
  # aucun ne dépend de l'autre : ils tournent en parallèle, et un échec de l'un ne retarde plus
  # le début de l'autre.
  release:
    runs-on: ubuntu-latest
    # Aucune compilation ici — juste du texte et un appel à `gh`. Cinq minutes est déjà large.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # `git log v(précédent)..v(courant)` a besoin de l'historique et des tags.
          fetch-depth: 0

      - name: le tag correspond à la version des fichiers
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          python3 scripts/verifier-version.py "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # **Seule la présence du secret décide du texte des notes, pas sa forme.** La validation
      # complète — UUID, dix caractères, préfixe attendu — reste dans le job `macos`, seul
      # concerné : elle gagne à échouer vite là où elle coûte quarante minutes de construction,
      # pas ici où un mauvais verdict ne coûterait qu'une phrase de travers dans les notes.
      - name: notarise ?
        env:
          IDENTITE: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -n ${IDENTITE:-} ]]; then
            echo "NOTARISE=oui" >> "$GITHUB_ENV"
          else
            echo "NOTARISE=non" >> "$GITHUB_ENV"
          fi

      - name: notes de version
        run: |
          set -euo pipefail
          mkdir -p publication
          precedent=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' \
            "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## Installation"
            echo
            if [[ ${NOTARISE:-non} == oui ]]; then
              # Notariée : il n'y a rien à expliquer, et surtout aucun contournement à
              # documenter. Une notice de sécurité qui traîne après avoir cessé d'être vraie
              # apprend à l'utilisateur à ignorer les notices.
              echo "Téléchargez \`DoraBase-$VERSION-universal.dmg\` ci-dessous, ouvrez-le, et"
              echo "glissez **DoraBase** dans **Applications**. C'est tout : l'application est"
              echo "signée et notariée par Apple."
              echo
              # Dit une fois ici plutôt que dans un « et au fait » : c'est la question que se
              # pose quelqu'un qui a déjà l'application, et il la lit sur cette page.
              echo "Déjà installée ? Il n'y a rien à télécharger : DoraBase propose la mise à"
              echo "jour dans sa barre d'état, et se relance seule."
            else
              echo "> Cette version n'est **pas notariée** : elle a été construite sans les"
              echo "> secrets de signature. macOS la refusera au premier lancement."
              echo
              echo "Téléchargez le \`.dmg\`, glissez **DoraBase** dans **Applications**, puis :"
              echo
              echo '```bash'
              echo 'xattr -dr com.apple.quarantine /Applications/DoraBase.app'
              echo '```'
            fi
            echo
            echo "macOS 13 Ventura ou plus récent. Bundle universel : Apple Silicon et Intel."
            echo
            # **Windows, et ce qu'il n'a pas.** Dit dans les notes plutôt que découvert au
            # téléchargement : l'avertissement de SmartScreen ressemble à une application
            # cassée. Ce qui suivait — « et les installations ne se mettent pas à jour
            # seules » — a cessé d'être vrai le 14 septembre 2026 (`API-58`), et la phrase est
            # partie avec l'état qu'elle décrivait : une note de release fausse est lue par
            # tous ceux qui téléchargent, et par eux seuls.
            echo "### Windows"
            echo
            echo "\`DoraBase-$VERSION-x64-setup.exe\` ci-dessous. L'installateur **n'est pas"
            echo "signé** : Windows affichera un avertissement SmartScreen, à passer par"
            echo "*Informations complémentaires → Exécuter quand même*."
            echo
            echo "Une fois installée, l'application **se met à jour toute seule** : ce qu'elle"
            echo "accepte d'installer est signé par la clé du projet, qu'elle vérifie avant de"
            echo "se remplacer."
            echo
            echo "## Changements"
            echo
            if [[ -n $precedent ]]; then
              # Écrit à part **et** repris ici : c'est ce même texte que le manifeste de mise à
              # jour porte, donc que l'application affiche avant de se remplacer. Deux
              # générations indépendantes finiraient par ne plus dire la même chose, et celle
              # que l'utilisateur lit dans l'application est la moins relue des deux.
              git log --no-merges --pretty='- %s' "$precedent..$GITHUB_REF_NAME" \
                > publication/changements.md
              cat publication/changements.md
              echo
              # **Accolades obligatoires.** `$precedent…` : bash range les octets non-ASCII de
              # l'ellipse *dans le nom de variable*, cherche « precedent… », ne le trouve pas, et
              # `set -u` fait échouer l'étape. La v0.1.0 y avait échappé — sans tag précédent, elle
              # passait par la branche « première version publiée ». Le défaut n'existait donc que
              # de la **deuxième** publication, là où plus personne ne relit le script.
              echo "[Comparer ${precedent}…${GITHUB_REF_NAME}](https://github.com/${GITHUB_REPOSITORY}/compare/${precedent}...${GITHUB_REF_NAME})"
            else
              echo "- première version publiée"
            fi
          } > publication/notes.md
          cat publication/notes.md

      # **Créée sans aucun asset.** `macos` et `windows` y ajouteront les leurs par
      # `gh release upload`, en parallèle l'un de l'autre — c'est tout le point de ce job.
      - name: créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "DoraBase $VERSION" \
            --notes-file publication/notes.md \
            --latest

      # `changements.md` voyage jusqu'au job `macos`, qui en a besoin pour le champ « notes »
      # du manifeste de mise à jour — c'est le même texte que celui déjà publié dans la
      # release, pas une seconde génération : un fichier généré n'a qu'un seul producteur.
      - uses: actions/upload-artifact@v4
        with:
          name: changements
          path: publication/changements.md
          retention-days: 1

  macos:
    needs: release
    runs-on: macos-latest
    # Ce que le job `manifeste` a besoin de savoir de celui-ci, et qu'aucun `result` ne dirait :
    # un job **réussi** peut n'avoir rien à faire figurer au manifeste — c'est le cas d'un fork
    # sans les secrets Apple, où la construction va au bout sans notariser et où l'archive n'est
    # donc pas publiée. La sortie est posée par l'étape qui nomme l'archive, qui est précisément
    # celle que `NOTARISE` gouverne.
    outputs:
      maj: ${{ steps.archive-maj.outputs.publiee }}
    # Une stalle ne doit pas se déguiser en travail — même raison que le job `engine` de
    # `ci.yml`. Une construction universelle compile la crate deux fois : quarante minutes
    # laissent de la marge, une heure trente n'en serait plus.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          # `git log v(précédent)..v(courant)` a besoin de l'historique et des tags ; un
          # checkout superficiel n'en a ni l'un ni l'autre, et les notes de version seraient
          # vides sans que rien ne le dise.
          fetch-depth: 0

      # **Le tag et les fichiers doivent dire le même numéro.** Un tag `v0.3.0` posé sur un
      # arbre resté en `0.2.0` publierait un `.dmg` nommé `0.2.0` sous une release `0.3.0` :
      # à partir de là, personne ne peut plus dire ce qu'il a installé. Vérifié **avant** de
      # compiler, pour échouer en dix secondes plutôt qu'en trente minutes.
      - name: le tag correspond à la version des fichiers
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          python3 scripts/verifier-version.py "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: rustup show
        working-directory: src-tauri

      # Les deux cibles du bundle universel. `aarch64` est déjà celle du runner ; `x86_64` est
      # une construction croisée, et c'est elle qui rend le `.dmg` installable sur les Mac
      # Intel encore sous Ventura — le plancher que le projet s'est donné.
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
        working-directory: src-tauri

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Clé distincte de celle de `ci.yml` : ce job compile en `release` et pour deux
          # cibles. Partager la clé ferait invalider un cache par l'autre à chaque tour.
          key: publication

      - run: pnpm install --frozen-lockfile

      # **Les deux architectures du proxy, et leur fusion.** Tauri ne fond rien : pour
      # `--target universal-apple-darwin` il exige un fichier
      # `cloud-sql-proxy-universal-apple-darwin` déjà universel, et son absence n'apparaît
      # qu'au *bundling* — donc après cinq minutes de compilation. C'est
      # `telecharger-proxy.sh --tous` qui appelle `lipo`. Comme dans `ci.yml`, c'est une
      # dépendance de compilation et non une étape de packaging (défaut n° 111).
      - run: pnpm proxy:embarquer:tous

      # Le même fait, constaté en deux secondes plutôt qu'en cinq minutes. Le script vient de
      # produire ce fichier et vérifie déjà son contenu ; cette étape existe pour que l'échec
      # tombe **avant** la compilation, et le message dit quoi lancer.
      - name: le sidecar universel est là avant de compiler
        run: |
          set -euo pipefail
          universel=src-tauri/binaries/cloud-sql-proxy-universal-apple-darwin
          if [[ ! -f $universel ]]; then
            echo "::error::$universel manque — 'pnpm proxy:embarquer:tous' doit le fondre"
            exit 1
          fi
          archs=$(lipo -archs "$universel")
          echo "$universel : $archs"
          grep -q arm64 <<<"$archs"
          grep -q x86_64 <<<"$archs"

      # **La clé qui signe les mises à jour, contrôlée avant de compiler.** `tauri.conf.json`
      # porte la clé publique : Tauri **échoue le bundling** s'il ne trouve pas la privée en
      # face — donc après la compilation des deux cibles. Même leçon que les secrets Apple, même
      # remède, et la vérification de forme est la même que celle qu'on peut faire sans réseau :
      # le fichier de clé minisign est du base64 dont le texte clair commence par
      # « untrusted comment: ». Un secret collé sans son en-tête, ou tronqué, échoue ici.
      #
      # **Cette clé n'est pas celle d'Apple, et elle n'est pas optionnelle.** Apple décide si
      # macOS *ouvre* l'application ; celle-ci décide si une application déjà installée accepte
      # de se remplacer par ce qu'on lui envoie. Sans elle, la voie de mise à jour de tous les
      # utilisateurs déjà installés est coupée, et il n'y a pas de rattrapage : la clé publique
      # est dans le bundle qu'ils ont.
      - name: la clé de signature des mises à jour est là, et bien formée
        env:
          CLEF: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MOT_DE_PASSE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z ${CLEF:-} ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY est vide — le bundling échouera après la"
            echo "  compilation, puisque tauri.conf.json annonce une clé publique. Voir le README." >&2
            exit 1
          fi
          if [[ -z ${MOT_DE_PASSE:-} ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD est vide — la clé a été générée avec" >&2
            echo "  un mot de passe, et Tauri ne peut pas l'ouvrir sans." >&2
            exit 1
          fi
          base64 -d <<<"$CLEF" 2>/dev/null | head -c 18 | grep -q 'untrusted comment' || {
            echo "::error::TAURI_SIGNING_PRIVATE_KEY n'est pas une clé minisign — c'est le contenu" >&2
            echo "  entier du fichier produit par 'tauri signer generate', en une ligne base64." >&2
            exit 1
          }
          echo "clé de signature des mises à jour : présente et bien formée"

      # ── Ce qui doit être vrai avant de publier un binaire ──────────────────────────────
      #
      # Le tag est censé être posé sur un `main` déjà vert, et `scripts/version.sh` refuse de
      # le poser ailleurs. Mais « censé » n'est pas une vérification : ces quatre étapes-là
      # sont celles qui tiennent en quelques minutes, et elles rendent vraie la phrase « rien
      # n'est publié qui n'ait été vérifié ». Playwright et les tests sur base réelle restent
      # dans `ci.yml` : ils demandent un serveur et quatre décors, et ce job n'a pas à les
      # remonter pour la seconde fois.
      - run: ./scripts/verifier-aucun-sabotage.sh
      - run: ./scripts/verifier-fond-dmg.sh
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: cargo test
        working-directory: src-tauri

      # ── Signature et notarisation Apple ────────────────────────────────────────────────
      #
      # **Tout ce bloc est conditionnel.** Sans les secrets — un clone, un fork, une bifurcation
      # de travail —, la construction reste celle d'avant : signature ad hoc, application qui
      # demande un geste au premier lancement. Un workflow qui exige un certificat pour
      # s'exécuter rendrait le dépôt inconstructible pour tout le monde sauf son auteur.
      #
      # `NOTARISE` porte cette condition une seule fois : une expression répétée dans cinq `if`
      # finit par différer dans l'un des cinq.
      #
      # **Et les cinq secrets sont contrôlés ici, avant de compiler.** Un secret absent vaut la
      # chaîne vide, que Tauri passe telle quelle à `notarytool` : le 25 août 2026, un
      # `--issuer ''` a fait échouer la publication **après** la signature, donc après vingt
      # minutes de compilation — et le nom du secret fautif n'apparaissait nulle part, seulement
      # « must be a valid UUID ». Chaque forme est donc vérifiée, et le message nomme le secret.
      - name: signature Apple disponible ?
        env:
          IDENTITE: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERTIFICAT: ${{ secrets.APPLE_CERTIFICATE }}
          MOT_DE_PASSE: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CLEF: ${{ secrets.APPLE_API_KEY }}
          EMETTEUR: ${{ secrets.APPLE_ISSUER_ID }}
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [[ -z ${IDENTITE:-} ]]; then
            echo "NOTARISE=non" >> "$GITHUB_ENV"
            echo "::notice::pas de secret APPLE_SIGNING_IDENTITY — signature ad hoc, sans notarisation"
            exit 0
          fi

          manquants=()
          [[ -n ${CERTIFICAT:-} ]] || manquants+=(APPLE_CERTIFICATE)
          [[ -n ${MOT_DE_PASSE:-} ]] || manquants+=(APPLE_CERTIFICATE_PASSWORD)
          [[ -n ${CLEF:-} ]] || manquants+=(APPLE_API_KEY)
          [[ -n ${EMETTEUR:-} ]] || manquants+=(APPLE_ISSUER_ID)
          [[ -n ${P8:-} ]] || manquants+=(APPLE_API_KEY_P8)
          if (( ${#manquants[@]} )); then
            echo "::error::signature demandée, mais ces secrets sont vides : ${manquants[*]}"
            echo "  la signature sans notarisation laisserait la fenêtre de Gatekeeper : ce job"
            echo "  refuse de publier à moitié." >&2
            exit 1
          fi

          # Les deux formes qu'Apple impose, et que l'on peut vérifier sans réseau. Un Issuer ID
          # est un UUID ; un Key ID fait dix caractères alphanumériques majuscules. Les avoir
          # échangés est l'erreur naturelle, les deux vivant dans le même écran.
          grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' \
            <<<"$EMETTEUR" || {
            echo "::error::APPLE_ISSUER_ID n'est pas un UUID — c'est l'« Issuer ID » d'App Store"
            echo "  Connect (Users and Access ▸ Integrations), pas le Key ID." >&2
            exit 1
          }
          grep -Eq '^[A-Z0-9]{8,12}$' <<<"$CLEF" || {
            echo "::error::APPLE_API_KEY ne ressemble pas à un Key ID (dix caractères, A-Z0-9)" >&2
            exit 1
          }
          grep -q '^Developer ID Application:' <<<"$IDENTITE" || {
            echo "::error::APPLE_SIGNING_IDENTITY doit commencer par « Developer ID Application: »" >&2
            exit 1
          }

          echo "NOTARISE=oui" >> "$GITHUB_ENV"
          echo "signature et notarisation Apple : activées, cinq secrets présents et bien formés"

      # La clé App Store Connect est un **fichier** pour `notarytool`, alors qu'un secret est une
      # chaîne : elle est donc écrite ici, en base64 inverse, hors de l'arbre de travail et en 600.
      # `printf` et une redirection, jamais un `echo` dans un pipeline : le masquage des logs ne
      # suit pas une valeur transformée.
      - name: écrire la clé API Apple
        if: env.NOTARISE == 'oui'
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          # Une clé tronquée ou mal encodée ne se voit qu'à l'échec de la soumission, vingt
          # minutes plus tard. `openssl` la **lit en entier** : un contrôle sur la seule première
          # ligne laissait passer une clé coupée, puisque l'en-tête tient dans les premiers
          # octets — essayé, et le garde était vert sur une clé de quarante caractères.
          openssl pkey -in "$RUNNER_TEMP/AuthKey.p8" -noout
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # `tauri.conf.json` porte `"signingIdentity": "-"` — la signature ad hoc, qui est le bon
      # défaut sans certificat. La retirer ici laisse `APPLE_SIGNING_IDENTITY` décider, sans
      # dépendre d'une précédence entre la conf et l'environnement que rien ne documente. Le
      # fichier du dépôt n'est pas touché : c'est une copie de travail du runner.
      - name: laisser l'identité réelle signer
        if: env.NOTARISE == 'oui'
        run: |
          set -euo pipefail
          python3 - <<'FIN'
          import json
          from pathlib import Path
          chemin = Path("src-tauri/tauri.conf.json")
          conf = json.loads(chemin.read_text())
          retiree = conf["bundle"]["macOS"].pop("signingIdentity", None)
          assert retiree == "-", f"signingIdentity valait {retiree!r}, « - » attendu"
          chemin.write_text(json.dumps(conf, indent=2, ensure_ascii=False) + "\n")
          print("signingIdentity retirée de la copie de travail")
          FIN

      # ── Le bundle ──────────────────────────────────────────────────────────────────────
      #
      # `--target universal-apple-darwin` : un seul `.dmg` pour les deux architectures. Deux
      # fichiers séparés obligeraient l'utilisateur à savoir quel Mac il a — une question à
      # laquelle un explorateur de bases de données n'a pas à faire répondre.
      #
      # Les variables `APPLE_*` sont lues par Tauri lui-même : présentes, il signe avec
      # l'identité, soumet à `notarytool`, attend le verdict et agrafe le ticket ; absentes, il
      # signe en ad hoc et l'annonce dans son log (« skipping app notarization »).
      #
      # `TAURI_BUNDLER_DMG_IGNORE_CI` : **sans elle, la version publiée sort avec la vue Finder
      # par défaut.** Le bundler DMG ajoute `--skip-jenkins` dès qu'il voit `CI` dans
      # l'environnement, et ce drapeau saute l'AppleScript qui pose le fond, la taille de
      # fenêtre et la position des deux icônes — sans erreur, sans trace. Le `.dmg` se
      # construit, se signe, se notarie et se publie, dépouillé.
      - run: pnpm tauri build --target universal-apple-darwin
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: true
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # Le secret s'appelle `APPLE_ISSUER_ID`, la variable que Tauri lit s'appelle
          # `APPLE_API_ISSUER` : la correspondance se fait ici, une fois.
          APPLE_API_ISSUER: ${{ secrets.APPLE_ISSUER_ID }}
          # **La signature des artefacts de mise à jour** (`createUpdaterArtifacts`). Deux
          # variables dont Tauri porte déjà les noms — pas de correspondance à faire ici.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # La version affichée vient du build et elle est **figée sous Playwright** : sans quoi
      # chaque publication périmerait les captures de fidélité. La contrepartie est de vérifier
      # que le décor ne sort pas du décor — voir l'en-tête du script.
      - run: ./scripts/verifier-aucun-decor-de-version.sh

      # C'est l'écran que voit qui télécharge : le fond, la taille de la fenêtre et les deux
      # emplacements d'icônes. Rien en amont n'échoue quand ils manquent, d'où ce constat sur
      # le volume réellement monté. Il vient **avant** la notarisation : celle-ci coûte une
      # vingtaine de minutes d'attente, qu'il serait absurde de payer pour découvrir ensuite
      # que l'image publiée est nue.
      - name: la fenêtre d'installation est dans le .dmg
        run: |
          set -euo pipefail
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          ./scripts/verifier-dmg-monte.sh "$dmg"

      # **Tauri notarie l'application, pas l'image.** Constaté à la 0.1.4 : l'app revient
      # « Accepted » et agrafée, et `stapler validate` sur le `.dmg` répond « does not have a
      # ticket stapled to it ». Or c'est l'image que l'utilisateur télécharge, donc elle que
      # macOS met en quarantaine et évalue à l'ouverture : sans ticket, l'avertissement
      # reparaîtrait sur l'image après avoir disparu de l'application.
      #
      # Tauri l'a bien **signée** avec l'identité — il ne manque que la soumission. L'agrafage
      # modifie le fichier, donc cette étape passe avant celle qui le copie et calcule son
      # empreinte.
      - name: notarier l'image
        if: env.NOTARISE == 'oui'
        env:
          CLEF_ID: ${{ secrets.APPLE_API_KEY }}
          EMETTEUR: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          set -euo pipefail
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          # Le verdict est lu dans la sortie plutôt que déduit du code de retour : `notarytool
          # submit --wait` rend la main quand le traitement s'achève, ce qui n'est pas la même
          # chose que l'avoir accepté.
          sortie=$(xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" --key-id "$CLEF_ID" --issuer "$EMETTEUR" \
            --wait --timeout 30m 2>&1)
          echo "$sortie"
          grep -qE 'status: Accepted' <<<"$sortie"
          xcrun stapler staple "$dmg"

      # **L'archive de mise à jour contient un second exemplaire de l'application**, et rien ne
      # garantit *a priori* qu'il soit celui qu'Apple a accepté : Tauri fabrique les artefacts de
      # mise à jour au même moment que le `.dmg`, donc après la notarisation — mais « après » est
      # une lecture de l'ordre des étapes, pas une vérification. Or l'erreur serait invisible
      # jusqu'à ce qu'un utilisateur déjà installé se retrouve avec une application que macOS
      # refuse de lancer, sans plus aucune voie de retour. On ouvre donc l'archive et on demande.
      #
      # Constaté et non supposé, comme la notarisation de l'image : c'est le même piège, à
      # l'étage suivant.
      - name: l'archive de mise à jour porte bien l'application notariée
        if: env.NOTARISE == 'oui'
        run: |
          set -euo pipefail
          archive=src-tauri/target/universal-apple-darwin/release/bundle/macos/DoraBase.app.tar.gz
          test -f "$archive"
          test -f "$archive.sig"
          ouverture=$(mktemp -d)
          tar -xzf "$archive" -C "$ouverture"
          xcrun stapler validate "$ouverture/DoraBase.app"
          codesign --display --verbose=4 "$ouverture/DoraBase.app" 2>&1 \
            | grep -F 'Authority=Developer ID Application'
          # Les deux architectures, ici aussi : une archive mono-architecture s'installerait
          # chez la moitié des utilisateurs et casserait l'autre moitié.
          for binaire in DoraBase cloud-sql-proxy; do
            archs=$(lipo -archs "$ouverture/DoraBase.app/Contents/MacOS/$binaire")
            echo "$binaire : $archs"
            grep -q arm64 <<<"$archs"
            grep -q x86_64 <<<"$archs"
          done
          rm -rf "$ouverture"
          echo "archive de mise à jour : notariée, agrafée, universelle"

      - name: le bundle est bien universel
        run: |
          set -euo pipefail
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/DoraBase.app
          # `lipo -archs` liste les architectures présentes. Sans cette étape, une cible mal
          # nommée produirait un bundle mono-architecture au chemin attendu, et le `.dmg`
          # publié s'appellerait « universal » sans l'être.
          for binaire in "$app/Contents/MacOS/DoraBase" "$app/Contents/MacOS/cloud-sql-proxy"; do
            archs=$(lipo -archs "$binaire")
            echo "$binaire : $archs"
            grep -q arm64 <<<"$archs"
            grep -q x86_64 <<<"$archs"
          done

      # Même vérification que dans `ci.yml`, et pour la même raison : c'est la seule preuve
      # automatisable que le proxy est *embarqué*. Elle est refaite ici parce que c'est **ce
      # bundle-ci** qui part chez l'utilisateur, et qu'il est construit par un autre chemin
      # (cible universelle) que celui que `ci.yml` exerce.
      - name: le proxy Cloud SQL est bien dans le bundle
        run: |
          set -euo pipefail
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/DoraBase.app
          test -x "$app/Contents/MacOS/cloud-sql-proxy"
          test -f "$app/Contents/Resources/licences/cloud-sql-proxy/LICENSE"
          test -f "$app/Contents/Resources/licences/cloud-sql-proxy/VERSION"
          attendue=$(sed -n 's/^version *= *//p' src-tauri/cloud-sql-proxy.lock | head -1)
          "$app/Contents/MacOS/cloud-sql-proxy" --version | grep -F "$attendue"

      # **La signature, même ad hoc, décide si l'application se lance ailleurs.** `lipo`
      # invalide les signatures des tranches qu'il fusionne : sans une signature reprise
      # après coup, macOS refuse le bundle sur une autre machine que celle qui l'a construit
      # — et un exécutable embarqué non signé le fait refuser à coup sûr.
      # `signingIdentity: "-"` dans `tauri.conf.json` demande cette signature ad hoc à Tauri,
      # qui la pose **avant** de fabriquer le `.dmg`. Cette étape ne signe rien : elle
      # constate. Un `--verify` qui échoue veut dire que le `.dmg` déjà fabriqué est
      # inutilisable, et qu'il ne faut pas le publier.
      #
      # Ce n'est pas une notarisation. Voir le README : l'utilisateur a un geste à faire au
      # premier lancement, et il n'y a pas de Developer ID pour l'en dispenser.
      - name: le bundle est signé, et notarié si on peut
        run: |
          set -euo pipefail
          racine=src-tauri/target/universal-apple-darwin/release/bundle
          app=$racine/macos/DoraBase.app
          dmg=$(ls "$racine"/dmg/*.dmg)

          # Vrai dans les deux cas : la signature couvre tout le bundle, sidecar compris.
          codesign --verify --deep --strict --verbose=2 "$app"

          if [[ ${NOTARISE:-non} != oui ]]; then
            codesign --display --verbose=2 "$app" 2>&1 | grep -F 'Signature=adhoc'
            echo "::notice::signature ad hoc — l'utilisateur aura un geste à faire au premier lancement"
            exit 0
          fi

          # **Trois faits distincts, et aucun n'implique les autres.**
          #
          #   `Authority=Developer ID Application` : signé par le bon certificat — un ad hoc
          #     silencieusement retombé passerait `codesign --verify` sans problème ;
          #   `stapler validate` : le ticket d'Apple est **agrafé** au bundle, donc Gatekeeper
          #     l'accepte même hors ligne. Sans agrafage, l'application dépend d'un aller-retour
          #     réseau chez l'utilisateur, et échoue derrière un pare-feu ;
          #   `spctl --assess` : le verdict que rend réellement le système au lancement. C'est
          #     celui-ci qui décide si la fenêtre « Apple n'a pas pu confirmer… » paraît.
          codesign --display --verbose=4 "$app" 2>&1 | grep -F 'Authority=Developer ID Application'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app" 2>&1 | grep -F 'source=Notarized Developer ID'

          # **Et le `.dmg` autant que l'application.** C'est lui que l'utilisateur télécharge,
          # donc lui que macOS met en quarantaine et évalue à l'ouverture. Une application
          # notariée dans une image qui ne l'est pas ferait reparaître l'avertissement — sur
          # l'image cette fois. Si cette ligne échoue, c'est que Tauri notarie l'app sans notarier
          # l'image : il faudra une soumission explicite (`notarytool submit` + `stapler staple`)
          # sur le `.dmg`, et non retirer la vérification.
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg" 2>&1 \
            | grep -F 'source=Notarized Developer ID'
          echo "notarié et agrafé : application et image"

      # Le nom que l'utilisateur verra dans ses téléchargements. Tauri nomme
      # `DoraBase_X.Y.Z_universal.dmg` ; le tiret et la casse du produit se lisent mieux, et
      # surtout le nom devient **prévisible** — c'est lui que le README annonce.
      - name: nommer le disque
        run: |
          set -euo pipefail
          mkdir -p publication
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          # Un seul `.dmg` attendu. Deux voudraient dire qu'un ancien traîne dans le cache,
          # et `ls` en choisirait un au hasard — donc peut-être la version d'avant.
          test "$(wc -l <<<"$dmg")" -eq 1
          cp "$dmg" "publication/DoraBase-$VERSION-universal.dmg"
          shasum -a 256 "publication/DoraBase-$VERSION-universal.dmg" \
            | sed "s|publication/||" > "publication/DoraBase-$VERSION-universal.dmg.sha256"
          ls -lh publication/

      # L'archive de mise à jour et sa signature, sous le même nom porteur de version que le
      # disque. Tauri les nomme `DoraBase.app.tar.gz` — un nom qui ne dit pas la version, donc
      # deux releases voisines exposeraient deux fichiers homonymes, et un `latest.json` mal
      # daté enverrait la mauvaise archive sans que personne ne le voie.
      - name: nommer l'archive de mise à jour
        id: archive-maj
        if: env.NOTARISE == 'oui'
        run: |
          set -euo pipefail
          source=src-tauri/target/universal-apple-darwin/release/bundle/macos/DoraBase.app.tar.gz
          cp "$source" "publication/DoraBase-$VERSION-universal.app.tar.gz"
          cp "$source.sig" "publication/DoraBase-$VERSION-universal.app.tar.gz.sig"
          ls -lh publication/
          echo "publiee=oui" >> "$GITHUB_OUTPUT"

      # La **signature** voyage jusqu'au job `manifeste`, pas l'archive : le manifeste porte le
      # contenu du `.sig` et une URL épinglée au tag, donc trente mégaoctets n'auraient rien à y
      # faire. L'archive, elle, part directement dans la release à l'étape suivante.
      - uses: actions/upload-artifact@v4
        if: env.NOTARISE == 'oui'
        with:
          name: maj-macos
          path: publication/DoraBase-*-universal.app.tar.gz.sig
          # Le défaut est `warn` : une signature non copiée donnerait un artefact vide, et
          # c'est le job `manifeste` qui échouerait, bien plus tard et loin de la cause.
          if-no-files-found: error
          retention-days: 1

      # ── La release ─────────────────────────────────────────────────────────────────────
      #
      # **La release existe déjà** : le job `release` l'a créée, avec son titre, ses notes et
      # `--latest`, avant qu'aucun bundle n'ait été construit — c'est ce qui laisse ce job
      # tourner en parallèle du job `windows` plutôt qu'attendre l'un après l'autre. Il n'y a
      # donc plus rien à y préparer : ce job téléverse ce qu'il a construit, et **le manifeste
      # de mise à jour ne lui appartient plus** — il porte désormais une clef par plateforme,
      # dont une que ce job ne peut pas signer. Voir le job `manifeste`.
      #
      # **Téléversé dans la release existante, jamais créé une seconde fois.** Le job
      # `release` a déjà appelé `gh release create` avec le titre, les notes et `--latest` :
      # un second `create` échouerait (le tag existe déjà), et de toute façon diviserait la
      # décision entre deux endroits. `gh release upload` **ajoute** des fichiers à une
      # release qui existe, sans toucher à son titre ni à ses notes.
      - name: téléverser les artefacts macOS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Le disque et son empreinte sont toujours là ; les deux fichiers de mise à jour
          # n'existent que si la construction était notariée. Le manifeste, lui, n'est plus
          # dans cette liste : c'est le job `manifeste` qui le téléverse, une fois les deux
          # plateformes construites.
          assets=(
            "publication/DoraBase-$VERSION-universal.dmg"
            "publication/DoraBase-$VERSION-universal.dmg.sha256"
          )
          if [[ ${NOTARISE:-non} == oui ]]; then
            assets+=(
              "publication/DoraBase-$VERSION-universal.app.tar.gz"
              "publication/DoraBase-$VERSION-universal.app.tar.gz.sig"
            )
          else
            echo "::notice::sans notarisation, pas d'archive — et le manifeste ne portera pas"
            echo "  de clef darwin : les installations macOS existantes ne verront pas cette"
            echo "  version."
          fi

          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

  # ── L'installateur Windows ───────────────────────────────────────────────────────────
  #
  # **Demandé le 1er septembre 2026 : la release porte aussi le `.exe`.** Ce qui change par
  # rapport à la décision d'origine — « Windows n'est pas une cible de publication » — est le
  # seul point de l'installateur ; tout le reste de cette décision tient toujours, et
  # notamment : **aucune mise à jour en place sous Windows**, voir plus bas.
  #
  # **`needs: release`, et non `needs: macos` — depuis le 2 septembre 2026.** La release
  # existe dès que le job `release` a rendu la main, avant qu'aucun bundle ne soit construit :
  # ce job-ci n'a donc plus besoin d'attendre la fin de la construction macOS pour commencer
  # la sienne. Les deux tournent en parallèle, chacun ajoutant ses artefacts par
  # `gh release upload` — jamais par un second `gh release create`, dont l'unicité reste ce
  # qui décide du titre, des notes et du `--latest`.
  #
  # La conséquence assumée est la même qu'avant, seulement plus rapide à se révéler : **un
  # échec de la construction Windows ne coûte pas la release macOS**, qui est l'artefact
  # soutenu — les deux jobs sont indépendants l'un de l'autre, pas seulement de leur ordre.
  windows:
    needs: release
    runs-on: windows-latest
    # Le pendant exact de la sortie du job `macos` : ce que `manifeste` doit savoir de
    # celui-ci, et qu'aucun `result` ne dirait. Ici la sortie est posée sans condition — il
    # n'y a pas d'équivalent de `NOTARISE` sous Windows —, mais un job qui échoue avant cette
    # étape ne la pose pas, et c'est cela qu'elle sert à dire.
    outputs:
      maj: ${{ steps.archive-maj.outputs.publiee }}
    # Pas de construction universelle ici, donc pas de double compilation : vingt-cinq minutes
    # laissent la même marge que les quarante du job macOS.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: le tag correspond à la version des fichiers
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          python3 scripts/verifier-version.py "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # `working-directory` est nécessaire : `rust-toolchain.toml` vit dans `src-tauri/`, et
      # rustup résout la toolchain au répertoire courant.
      - run: rustup show
        working-directory: src-tauri

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Avant toute commande cargo, et c'est structurel (défaut n° 111). Sous Windows le fichier
      # attendu porte l'extension — `cloud-sql-proxy-x86_64-pc-windows-msvc.exe`.
      - run: pnpm proxy:embarquer
        shell: bash

      # ── Ce qui doit être vrai avant de publier un binaire ─────────────────────────────
      #
      # Le même principe que dans le job macOS : le tag est *censé* être posé sur un `main`
      # vert, mais « censé » n'est pas une vérification et une release est publique. Ne sont
      # rejouées ici que les vérifications qui disent quelque chose de **cette** plateforme —
      # la moitié web est indépendante du système et le job macOS l'a déjà passée.
      - run: ./scripts/verifier-aucun-sabotage.sh
        shell: bash
      - run: python3 scripts/verifier-conf-windows.py
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

      # `createUpdaterArtifacts` fait échouer tout `tauri build` qui trouve une clé publique
      # dans `tauri.conf.json` sans clé privée en face. La vraie clé est donc donnée ici, comme
      # au job macOS — mais **l'archive qu'elle signe n'est pas publiée** : voir l'étape de
      # téléversement.
      - name: construire l'installateur
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # La version affichée vient du build : le décor de Playwright ne doit pas partir dans un
      # binaire livré. Même raison, même script que côté macOS.
      - run: ./scripts/verifier-aucun-decor-de-version.sh
        shell: bash

      # Le sidecar embarqué, constaté plutôt que supposé — le pendant de l'étape « le proxy
      # Cloud SQL est bien dans le bundle » du job macOS. C'est ici que se voit le défaut de
      # nommage : sans l'extension, le fichier n'est pas là où l'application le cherche.
      - name: le proxy Cloud SQL est bien dans le bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f src-tauri/target/release/cloud-sql-proxy.exe
          attendue=$(sed -n 's/^version *= *//p' src-tauri/cloud-sql-proxy.lock | head -1)
          src-tauri/target/release/cloud-sql-proxy.exe --version | grep -F "$attendue"

      # Tauri nomme l'installateur `DoraBase_<version>_x64-setup.exe`. Renommé sur la
      # convention du dépôt — `DoraBase-<version>-x64-setup.exe` —, avec son empreinte à côté,
      # comme le `.dmg`.
      - name: nommer l'installateur
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publication
          exe=$(ls src-tauri/target/release/bundle/nsis/*.exe)
          # Un seul attendu. Deux voudraient dire qu'un ancien traîne dans le cache, et `ls` en
          # choisirait un au hasard — donc peut-être la version d'avant.
          test "$(wc -l <<<"$exe")" -eq 1
          cp "$exe" "publication/DoraBase-$VERSION-x64-setup.exe"
          sha256sum "publication/DoraBase-$VERSION-x64-setup.exe" \
            | sed "s|publication/||" > "publication/DoraBase-$VERSION-x64-setup.exe.sha256"
          # L'étape suivante dérive la signature de **ce** fichier plutôt que de refaire un `ls` :
          # deux recherches indépendantes peuvent désigner deux installateurs, et le manifeste
          # annoncerait alors la signature de l'un pour l'URL de l'autre — une mise à jour refusée
          # chez l'utilisateur, sans rien qui échoue ici.
          echo "INSTALLATEUR=$exe" >> "$GITHUB_ENV"
          ls -lh publication/

      # ── La signature de mise à jour, depuis le 14 septembre 2026 (`API-58`) ──────────────
      #
      # **Ce qui a changé, et pourquoi.** Ces fichiers existaient depuis le premier jour —
      # `createUpdaterArtifacts` les produit à chaque `tauri build` — et ils n'étaient pas
      # publiés : sans certificat Authenticode, « rien n'atteste que l'exécutable téléchargé
      # vient de nous », l'arbitrage de « rien n'est proposé qui n'ait été notarié » transposé à
      # Windows. **La transposition était trop forte**, et les deux moitiés ne disent pas la
      # même chose :
      #
      #   - sur macOS, la notarisation décide si le système **ouvre** l'application. Une archive
      #     signée ad hoc s'installe proprement puis est refusée au redémarrage, chez quelqu'un
      #     qui n'a plus de voie de retour : c'est une panne franche, et c'est ce que le refus
      #     de publier évite ;
      #   - sous Windows, ce qui atteste l'origine d'une mise à jour est la **clé minisign** du
      #     projet, dont la moitié publique est dans `tauri.conf.json` — donc dans le bundle que
      #     les utilisateurs ont déjà. C'est la distinction qu'AGENTS.md écrit depuis le début :
      #     Apple décide si macOS ouvre l'application, la clé minisign décide si une
      #     installation accepte de se **remplacer** par ce qu'on lui envoie. Authenticode
      #     répond à une troisième question — ce que SmartScreen affiche à qui **télécharge**
      #     l'installateur dans un navigateur —, et celle-là reste entière : le `.exe` de la
      #     release est toujours non signé, et le README le dit toujours.
      #
      # Autrement dit le refus protégeait d'un risque que la clé de mise à jour couvre déjà, au
      # prix de la voie de mise à jour entière.
      #
      # **Et il n'y a pas d'archive : l'installateur *est* l'artefact de mise à jour** (corrigé
      # le 17 septembre 2026, après l'échec de la publication 0.11.0). La première version
      # cherchait un `.nsis.zip`, que ce dépôt ne produit pas — c'est la forme de compatibilité
      # v1 de Tauri, sous `createUpdaterArtifacts: "v1Compatible"`. Avec `true`, qui est ce que
      # `tauri.conf.json` déclare, le bundler signe l'installateur NSIS **lui-même** et écrit un
      # `…-setup.exe.sig` à côté. Le plugin le sait faire : il renifle les octets qu'il
      # télécharge (`extract` de `tauri-plugin-updater`), et un `.exe` nu est accepté tel quel.
      #
      # Conséquence voulue : le `.exe` de la release **porte les deux rôles**, l'installateur
      # qu'on télécharge à la main et la mise à jour que l'application va chercher. Le
      # dupliquer sous un second nom donnerait deux fois vingt mégaoctets d'un même binaire, et
      # un second nom à tenir en phase avec le premier ; c'est l'URL du manifeste qui désigne
      # celui-ci. macOS garde deux fichiers parce que là-bas ce sont deux choses — un `.dmg` à
      # ouvrir et une archive de l'application.
      - name: nommer la signature de mise à jour
        id: archive-maj
        shell: bash
        run: |
          set -euo pipefail
          # La signature de **l'installateur qu'on vient de publier**, nommée par l'étape
          # précédente : c'est elle que l'application vérifie avant de se remplacer, et le
          # manifeste en porte le contenu en face de l'URL de ce `.exe`-là.
          test -f "$INSTALLATEUR.sig"
          cp "$INSTALLATEUR.sig" "publication/DoraBase-$VERSION-x64-setup.exe.sig"
          ls -lh publication/
          echo "publiee=oui" >> "$GITHUB_OUTPUT"

      # Comme côté macOS, c'est la **signature** qui voyage jusqu'au job `manifeste`, pas
      # l'installateur : celui-ci n'écrit qu'un JSON, et il n'a besoin que du contenu du `.sig`.
      - uses: actions/upload-artifact@v4
        with:
          name: maj-windows
          path: publication/DoraBase-*-x64-setup.exe.sig
          # Le défaut est `warn` : une signature non copiée donnerait un artefact vide, et
          # c'est le job `manifeste` qui échouerait, bien plus tard et loin de la cause.
          if-no-files-found: error
          retention-days: 1

      - name: attacher l'installateur et sa signature à la release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            "publication/DoraBase-$VERSION-x64-setup.exe" \
            "publication/DoraBase-$VERSION-x64-setup.exe.sha256" \
            "publication/DoraBase-$VERSION-x64-setup.exe.sig" \
            --clobber
          echo "::notice::installateur Windows attaché — non signé, SmartScreen avertira au"
          echo "  téléchargement. La mise à jour en place, elle, est signée par la clé du projet."

  # ── Le manifeste de mise à jour ────────────────────────────────────────────────────────
  #
  # C'est le seul fichier que les applications déjà installées vont chercher, à une URL qui ne
  # nomme aucune version : `…/releases/latest/download/latest.json`. GitHub la redirige vers
  # l'asset de la release marquée « latest » — d'où le `--latest` du job `release`, qui cesse
  # d'être cosmétique : sans lui, plus personne ne trouve de mise à jour.
  #
  # **Pourquoi un job à part, depuis le 14 septembre 2026 (`API-58`).** Le manifeste était écrit
  # par le job `macos`, ce qui allait tant qu'il ne portait que des clefs `darwin-*`. Il porte
  # maintenant une clef que ce job **ne peut pas signer** : la signature Windows n'existe que
  # dans le job Windows, et les deux tournent en parallèle. Trois issues possibles, une seule
  # tenable :
  #
  #   - faire attendre l'un des deux — c'est reperdre le parallélisme du 2 septembre, et
  #     rebrancher un échec Windows sur la publication macOS ;
  #   - laisser Windows **compléter** le manifeste que macOS a téléversé — deux producteurs pour
  #     un fichier engendré, ce que ce dépôt refuse partout ailleurs, et une lecture-modification
  #     -écriture entre deux jobs par-dessus le marché ;
  #   - un troisième job qui **n'écrit rien d'autre** et qui attend les deux. C'est celui-ci.
  #
  # **Et il publie ce qui existe, plutôt que d'exiger les deux.** C'est ce qui garde la propriété
  # du 1er septembre — « un échec de la construction Windows ne coûte pas la release macOS » — en
  # la rendant symétrique : chaque plateforme entre au manifeste si, et seulement si, sa propre
  # construction a produit une archive signée. Une plateforme absente n'est pas un silence pour
  # autant : l'application le dit, et nomme la manœuvre (voir `src-tauri/src/maj/mod.rs`).
  manifeste:
    needs: [macos, windows]
    # `!cancelled()` et non `always()` : une annulation demandée à la main ne doit pas publier
    # un manifeste à moitié. La seconde moitié est la condition qui décide qu'il y a quelque
    # chose à écrire — sans elle, un tag dont les deux constructions échouent téléverserait un
    # `platforms` vide, c'est-à-dire un manifeste que l'application lit sans y trouver personne.
    # Sur une seule ligne, et c'est délibéré : en scalaire replié (`>-`), une continuation
    # **plus indentée** que la première ligne garde son saut de ligne — donc `${{ … }}`
    # arriverait à GitHub coupé en deux. Mesuré en relisant le YAML analysé, pas supposé.
    if: ${{ !cancelled() && (needs.macos.outputs.maj == 'oui' || needs.windows.outputs.maj == 'oui') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Le nom dit ce que l'étape fait, et rien de plus : ce job ne vérifie **pas** que le tag
      # s'accorde aux fichiers du dépôt — les deux constructions l'ont déjà fait par
      # `verifier-version.py`, et il n'a même pas le dépôt sous la main, n'ayant rien à y lire.
      - name: la version, tirée du tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # `changements.md` sert le champ « notes » du manifeste — le même texte que celui déjà
      # publié dans la release, récupéré plutôt que régénéré : un fichier engendré n'a qu'un
      # seul producteur.
      - uses: actions/download-artifact@v4
        with:
          name: changements
          path: manifeste

      # **Une condition par plateforme, et c'est la sortie du job qui décide** — non son
      # `result`. Un job `macos` réussi mais non notarié (un fork sans les secrets Apple) n'a
      # pas d'archive à proposer : `download-artifact` échouerait sur un artefact absent, et
      # `continue-on-error` masquerait au passage une vraie panne de téléchargement.
      - uses: actions/download-artifact@v4
        if: needs.macos.outputs.maj == 'oui'
        with:
          name: maj-macos
          path: manifeste
      - uses: actions/download-artifact@v4
        if: needs.windows.outputs.maj == 'oui'
        with:
          name: maj-windows
          path: manifeste

      - name: écrire le manifeste
        run: |
          set -euo pipefail
          python3 - <<'FIN'
          import json, os, pathlib

          version = os.environ["VERSION"]
          tag = os.environ["GITHUB_REF_NAME"]
          depot = os.environ["GITHUB_REPOSITORY"]
          dossier = pathlib.Path("manifeste")

          # Une entrée par clef que Tauri sait chercher : il compose la sienne en
          # `{plateforme}-{architecture}` et ne connaît pas la notion d'universel — d'où deux
          # clefs darwin pour **une** archive, qui l'est.
          #
          # L'URL est **épinglée au tag** et non à « latest » : le manifeste annonce une
          # version, il doit désigner l'archive de cette version. Une URL en « latest » ferait
          # installer autre chose que ce qui vient d'être annoncé et vérifié.
          # Sous Windows, l'artefact de mise à jour **est** l'installateur : avec
          # `createUpdaterArtifacts: true`, le bundler signe le `.exe` NSIS lui-même, et le
          # plugin accepte un `.exe` nu (il renifle les octets reçus). D'où un fichier de la
          # release qui porte les deux rôles, là où macOS en a deux.
          sources = {
              f"DoraBase-{version}-universal.app.tar.gz": ("darwin-aarch64", "darwin-x86_64"),
              f"DoraBase-{version}-x64-setup.exe": ("windows-x86_64",),
          }

          plateformes = {}
          for archive, clefs in sources.items():
              signature = dossier / f"{archive}.sig"
              # Absente = cette construction-là n'a rien produit. On n'annonce pas ce qu'on
              # n'a pas : mieux vaut un manifeste d'une seule plateforme qu'une clef qui
              # pointe sur une URL en 404.
              if not signature.exists():
                  print(f"pas de signature pour {archive} — {'/'.join(clefs)} hors manifeste")
                  continue
              url = f"https://github.com/{depot}/releases/download/{tag}/{archive}"
              for clef in clefs:
                  plateformes[clef] = {
                      "signature": signature.read_text().strip(),
                      "url": url,
                  }

          # La condition du job l'a déjà dit, mais elle le dit en YAML : ceci le redit là où
          # une erreur d'écriture de cette condition se verrait.
          if not plateformes:
              raise SystemExit("aucune signature — il n'y a pas de manifeste à écrire")

          notes = dossier / "changements.md"

          # **Pas de `pub_date`.** Le champ est optionnel, il n'est affiché nulle part, et il est
          # typé côté Tauri : une date mal formée ne rend pas le manifeste incomplet, elle le
          # rend *illisible* — donc coupe la mise à jour pour tout le monde. Un champ décoratif
          # ne mérite pas ce mode de défaillance.
          manifeste = {
              "version": version,
              "notes": notes.read_text().strip() if notes.exists() else "",
              "platforms": plateformes,
          }
          (dossier / "latest.json").write_text(json.dumps(manifeste, indent=2) + "\n")
          print(json.dumps(manifeste, indent=2)[:600])
          FIN

      # Téléversé dans la release que le job `release` a créée, jamais par un second `create` —
      # même raison que les deux jobs de construction.
      #
      # **`--repo` est indispensable ici, et il l'est pour ce job seul** (17 septembre 2026,
      # après l'échec de la publication 0.11.0). `gh` déduit le dépôt du *remote git* du
      # répertoire courant : les trois autres jobs se sont fait `checkout`, celui-ci non — il
      # n'a rien à lire dans le dépôt, et c'est écrit plus haut. Il répondait donc
      # `failed to run git: fatal: not a git repository`, **après** avoir composé un manifeste
      # juste. Ce qui se perd alors n'est pas la clef Windows mais `latest.json` **en entier** :
      # `…/releases/latest/download/latest.json` rend un 404, et plus personne ne se met à
      # jour, sur aucune des deux plateformes.
      - name: téléverser le manifeste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" manifeste/latest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
